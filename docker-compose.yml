giservices:
  auth-service:
    build: ./auth-service
    ports:
      - "5004:5004"
    environment:
      - PORT=5004
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - REFRESH_TOKEN_EXPIRES_IN=${REFRESH_TOKEN_EXPIRES_IN}

  gateway:
    build: ./gateway
    ports:
      - "4000:4000"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:5004
      - RESTAURANT_SERVICE_URL=http://restaurant-service:5001
      - ORDER_SERVICE_URL=http://order-service:5002
      - DELIVERY_SERVICE_URL=http://delivery-service:5003
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - auth-service
      - restaurant-service
      - order-service
      - delivery-service

  restaurant-service:
    build: ./restaurant-service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}

  order-service:
    build: ./order-service
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - RESTAURANT_SERVICE_URL=http://restaurant-service:5001
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - restaurant-service

  delivery-service:
    build: ./delivery-service
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - ORDER_SERVICE_URL=http://order-service:5002
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - order-service

  client:
    build: ./client
    ports:
      - "3000:80"


